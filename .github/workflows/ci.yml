name: CI

on:
  push:
  pull_request:

jobs:
  lightweight-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check installed dependencies and entry points
        run: |
          python -m pip check
          fyp-audit --help
          fyp-migrate-artifacts --help
          fyp-evaluate-recommendations --help
          fyp-evaluate-search --help
          fyp-build-reviews --help
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
      - name: Parse all Python source files
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for path in Path(".").rglob("*.py"):
              ast.parse(path.read_text(encoding="utf-8-sig"), filename=str(path))
          PY
